<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntegralMix · Chat Analítico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#009A44',  /* Verde principal da logo */
              red: '#E31837',    /* Vermelho do MIX e pingo do i */
              orange: '#F37021', /* Laranja do degradê */
              light: '#F8FAFC'   /* Fundo cinza super claro */
            }
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    /* Scrollbar customizada clean */
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    #messages::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Animação de digitação (3 pontos) */
    .dot-pulse span {
      display: inline-block;
      width: 6px; height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
    .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40%           { transform: scale(1);   opacity: 1;   }
    }

    /* Fade-in das mensagens */
    .msg-enter { animation: fadeSlide 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col items-center justify-center font-sans antialiased p-4">

  <div class="flex flex-col w-full max-w-3xl h-full max-h-[900px] bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-100">

    <header class="flex items-center gap-4 shrink-0 bg-white px-6 py-4 border-b border-gray-100 shadow-sm z-10">
      <div class="w-12 h-12 bg-brand-green rounded-full flex items-center justify-center shrink-0 shadow-inner overflow-hidden border-2 border-white outline outline-2 outline-gray-100">
        <img src="image_5b6fa4.png" alt="IntegralMix Logo" class="w-full h-full object-cover" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <span class="text-white font-bold text-lg hidden">IM</span>
      </div>
      <div>
        <h1 class="text-lg font-bold text-gray-900 leading-tight">Chat Analítico</h1>
        <p class="text-sm text-gray-500 font-medium">Assistente de Inteligência de Negócios</p>
      </div>
    </header>

    <main id="messages" class="flex-1 overflow-y-auto flex flex-col gap-6 p-6 bg-brand-light scroll-smooth">

      <div class="flex gap-3 items-end msg-enter">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-orange to-brand-red flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-md">IA</div>
        <div class="bg-white border border-gray-200 shadow-sm rounded-2xl rounded-bl-sm px-5 py-3.5 text-sm leading-relaxed max-w-[85%] text-gray-700">
          Olá! Sou seu assistente analítico da <strong>IntegralMix</strong>. Pergunte sobre <strong>faturamento</strong>, <strong>vendedores</strong>, <strong>clientes</strong>, <strong>regiões</strong> e muito mais. Como posso ajudar hoje?
        </div>
      </div>

    </main>

    <footer class="shrink-0 bg-white p-4 border-t border-gray-100">
      <form id="chat-form" class="flex items-end gap-3 bg-gray-50 rounded-2xl px-4 py-3 border border-gray-200 focus-within:border-brand-green focus-within:ring-2 focus-within:ring-brand-green/20 transition-all shadow-inner">
        <textarea
          id="input"
          rows="1"
          placeholder="Ex: Qual foi o faturamento na região Nordeste?"
          class="flex-1 bg-transparent resize-none outline-none text-sm text-gray-800 placeholder-gray-400 max-h-32 leading-relaxed py-1"
          onInput="autoResize(this)"
          onKeyDown="handleKey(event)"
        ></textarea>
        <button
          type="submit"
          id="send-btn"
          class="w-10 h-10 rounded-xl bg-brand-green hover:bg-[#008239] active:scale-95 transition-all flex items-center justify-center shrink-0 disabled:opacity-50 disabled:cursor-not-allowed shadow-md text-white"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 ml-1">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
      <p class="text-center text-xs text-gray-400 mt-3 font-medium flex items-center justify-center gap-1">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-3 h-3 text-brand-green"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" /></svg>
    
      </p>
    </footer>

  </div>

  <script>
    const form     = document.getElementById('chat-form');
    const input    = document.getElementById('input');
    const messages = document.getElementById('messages');
    const sendBtn  = document.getElementById('send-btn');

    // Session ID
    function generateSessionId() {
      return Date.now().toString(36) + Math.random().toString(36).substring(2);
    }
    const sessionId = sessionStorage.getItem('chat_session_id') || (() => {
      const id = generateSessionId();
      sessionStorage.setItem('chat_session_id', id);
      return id;
    })();

    // Helpers de UI
    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.requestSubmit();
      }
    }

    function scrollToBottom() {
      messages.scrollTo({ top: messages.scrollHeight, behavior: 'smooth' });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/\n/g, '<br>');
    }

    function appendUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'flex gap-3 items-end justify-end msg-enter';
      div.innerHTML = `
        <div class="bg-brand-green shadow-md rounded-2xl rounded-br-sm px-5 py-3.5 text-sm leading-relaxed max-w-[85%] text-white">
          ${escapeHtml(text)}
        </div>`;
      messages.appendChild(div);
      scrollToBottom();
    }

    function appendTypingIndicator() {
      const div = document.createElement('div');
      div.id = 'typing';
      div.className = 'flex gap-3 items-end msg-enter';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-orange to-brand-red flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-md">IA</div>
        <div class="bg-white border border-gray-200 shadow-sm rounded-2xl rounded-bl-sm px-5 py-4">
          <div class="dot-pulse flex gap-1 items-center h-2">
            <span></span><span></span><span></span>
          </div>
        </div>`;
      messages.appendChild(div);
      scrollToBottom();
    }

    function removeTypingIndicator() {
      document.getElementById('typing')?.remove();
    }

    function appendAssistantMessage(text, sql, isClarification = false) {
      const div = document.createElement('div');
      div.className = 'flex gap-3 items-end msg-enter';

      // Clarificações têm borda laranja suave para distinguir visualmente
      const bubbleClass = isClarification
        ? 'bg-orange-50 border border-brand-orange/30 shadow-sm rounded-2xl rounded-bl-sm px-5 py-3.5 text-sm leading-relaxed max-w-[85%] text-gray-800'
        : 'bg-white border border-gray-200 shadow-sm rounded-2xl rounded-bl-sm px-5 py-3.5 text-sm leading-relaxed max-w-[85%] text-gray-700';

      const sqlBlock = sql
        ? `<details class="mt-3 group">
             <summary class="text-xs text-brand-green font-medium cursor-pointer hover:text-[#008239] transition-colors select-none flex items-center gap-1">
               <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 group-open:rotate-90 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
               Ver SQL gerado
             </summary>
             <pre class="mt-2 text-[11px] bg-gray-900 rounded-lg p-3 overflow-x-auto text-green-300 leading-relaxed font-mono shadow-inner">${escapeHtml(sql)}</pre>
           </details>`
        : '';

      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-brand-orange to-brand-red flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-md">IA</div>
        <div class="${bubbleClass}">
          ${escapeHtml(text)}
          ${sqlBlock}
        </div>`;
      messages.appendChild(div);
      scrollToBottom();
    }

    function appendErrorMessage(text) {
      const div = document.createElement('div');
      div.className = 'flex gap-3 items-end msg-enter';
      div.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-brand-red flex items-center justify-center text-white text-xs font-bold shrink-0 shadow-md">!</div>
        <div class="bg-red-50 border border-red-200 shadow-sm rounded-2xl rounded-bl-sm px-5 py-3.5 text-sm leading-relaxed max-w-[85%] text-red-700">
          ${escapeHtml(text)}
        </div>`;
      messages.appendChild(div);
      scrollToBottom();
    }

    // Envio da mensagem
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      appendUserMessage(question);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      appendTypingIndicator();

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: question, session_id: sessionId }),
        });

        const data = await res.json();
        removeTypingIndicator();

        if (!res.ok) {
          appendErrorMessage(data.error || 'Erro inesperado no servidor.');
        } else {
          appendAssistantMessage(data.answer, data.sql, data.clarification === true);
        }
      } catch (err) {
        removeTypingIndicator();
        appendErrorMessage('Não foi possível conectar ao servidor. Verifique se a aplicação está rodando.');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
